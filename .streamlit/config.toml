[server]
# Suppress WebSocket warnings
enableWebsocketCompression = true
maxUploadSize = 200

[client]
# Don't leak stack traces / file paths to the browser. Set to true locally
# for debugging (e.g. `--client.showErrorDetails=true`, or edit this file).
showErrorDetails = false

[logger]
# Reduce log verbosity to suppress benign WebSocket warnings
level = "error"
messageFormat = "%(asctime)s %(message)s"

[browser]
# Browser settings
gatherUsageStats = false
