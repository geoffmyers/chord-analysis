<svg xmlns="http://www.w3.org/2000/svg" width="740" height="537" viewBox="0 0 740 537" role="img" aria-label="Terminal output of python3 -m chord_analyzer --help">
<rect width="740" height="537" rx="10" fill="#12141c"/>
<rect width="740" height="32" rx="10" fill="#1b1e28"/>
<circle cx="20" cy="16" r="6" fill="#ff5f57"/>
<circle cx="38" cy="16" r="6" fill="#febc2e"/>
<circle cx="56" cy="16" r="6" fill="#28c840"/>
<text x="370" y="21" fill="#7f8798" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" text-anchor="middle">chord-analysis</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
<text x="18" y="63.0" fill="#5ac8fa" xml:space="preserve">$ chord-analyzer --help</text>
<text x="18" y="82.0" fill="#d6dae4" xml:space="preserve">usage: chord-analyzer [-h] [--version]</text>
<text x="18" y="101.0" fill="#d6dae4" xml:space="preserve">                      {analyze,find,info,stats,compare,check,transcribe,pitch-score}</text>
<text x="18" y="120.0" fill="#d6dae4" xml:space="preserve">                      ...</text>
<text x="18" y="139.0" fill="#d6dae4" xml:space="preserve"></text>
<text x="18" y="158.0" fill="#d6dae4" xml:space="preserve">Analyze chord progressions and find compatible samples</text>
<text x="18" y="177.0" fill="#d6dae4" xml:space="preserve"></text>
<text x="18" y="196.0" fill="#d6dae4" xml:space="preserve">positional arguments:</text>
<text x="18" y="215.0" fill="#d6dae4" xml:space="preserve">  {analyze,find,info,stats,compare,check,transcribe,pitch-score}</text>
<text x="18" y="234.0" fill="#d6dae4" xml:space="preserve">                        Available commands</text>
<text x="18" y="253.0" fill="#d6dae4" xml:space="preserve">    analyze             Analyze audio files and build database</text>
<text x="18" y="272.0" fill="#d6dae4" xml:space="preserve">    find                Find compatible samples</text>
<text x="18" y="291.0" fill="#d6dae4" xml:space="preserve">    info                Show analysis info for a sample</text>
<text x="18" y="310.0" fill="#d6dae4" xml:space="preserve">    stats               Display database statistics</text>
<text x="18" y="329.0" fill="#d6dae4" xml:space="preserve">    compare             Compare two samples directly</text>
<text x="18" y="348.0" fill="#d6dae4" xml:space="preserve">    check               Check system dependencies</text>
<text x="18" y="367.0" fill="#d6dae4" xml:space="preserve">    transcribe          Transcribe audio files to MIDI using state-of-the-art</text>
<text x="18" y="386.0" fill="#d6dae4" xml:space="preserve">                        models</text>
<text x="18" y="405.0" fill="#d6dae4" xml:space="preserve">    pitch-score         Score audio samples against a chord progression by</text>
<text x="18" y="424.0" fill="#d6dae4" xml:space="preserve">                        analyzing detected pitches</text>
<text x="18" y="443.0" fill="#d6dae4" xml:space="preserve"></text>
<text x="18" y="462.0" fill="#d6dae4" xml:space="preserve">options:</text>
<text x="18" y="481.0" fill="#d6dae4" xml:space="preserve">  -h, --help            show this help message and exit</text>
<text x="18" y="500.0" fill="#d6dae4" xml:space="preserve">  --version             show program&#x27;s version number and exit</text>
</g></svg>
